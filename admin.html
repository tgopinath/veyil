<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Veyil Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+Tamil:wght@400;700&display=swap">
<link rel="stylesheet" href="kolam/tokens.css">
<link rel="stylesheet" href="styles.css?v=8">
<link rel="stylesheet" href="admin.css?v=3">
</head>
<body class="admin">
<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="vy-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <filter id="vy-grain-c"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
  <filter id="vy-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="vy-blur-s"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="vy-drop" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="1.6" flood-color="#2a1608" flood-opacity=".38"/></filter>
</svg>

<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="3" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5 32 32M8 32l3.5-3.5M28.5 11.5 32 8"/></g></svg><span class="brand-t"><b>VEYIL</b><small>Admin</small></span></div>
    <h1>Sign in to manage products</h1>
    <div class="field"><label for="lu">Username</label><input id="lu" autocomplete="username" required></div>
    <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn btn-primary" style="width:100%">Sign in</button>
  </form>
</section>

<div class="shell" id="shell" hidden>
  <header class="a-top">
    <a class="brand" href="index.html" title="Open the store"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="3" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5 32 32M8 32l3.5-3.5M28.5 11.5 32 8"/></g></svg><span class="brand-t"><b>VEYIL</b><small>Admin</small></span></a>
    <span class="a-stats" id="stats"></span>
    <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">View store</a>
    <button class="btn btn-ghost btn-sm" id="logout">Sign out</button>
  </header>

  <aside class="a-list">
    <div class="a-list-h">
      <button class="btn btn-primary" id="newBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New product</button>
      <input class="a-search" id="q" type="search" placeholder="Find a product" aria-label="Find a product">
      <select id="shelfFilter" aria-label="Filter by shelf"></select>
    </div>
    <ul id="list" class="a-items"></ul>
  </aside>

  <main class="a-edit" id="editor" tabindex="-1"></main>

  <aside class="a-preview" aria-label="Live preview">
    <div class="pv-h"><b>Live preview</b><div class="pv-tabs" id="pvTabs" role="group" aria-label="Preview view"></div></div>
    <div class="pv-stage" id="pvStage"></div>
    <p class="pv-cap">How it looks on the store</p>
    <div id="pvCard"></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="credits.js?v=7"></script>
<script src="data.js?v=7"></script>
<script src="art.js?v=7"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
